name: Build and deploy

# One job: validate the plan, refresh the live snapshot from Meta (only if the
# META_ACCESS_TOKEN secret exists), commit it, and deploy to GitHub Pages.
# Pages "Source" must be set to "GitHub Actions" (Settings > Pages).

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'   # daily, ~6 a.m. Central
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate plan
        run: python3 scripts/validate.py
      - name: Sync live ads from Meta (read-only)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python3 scripts/sync_live.py
      - name: Commit refreshed live snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/live.json)" ]; then
            git add data/live.json && git commit -m "chore(data): sync live ads" && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
